---
# Rules for actions/labeler v7 (see .github/workflows/labeler.yml).
#
# config-sync overwrites this file in every repository, so no rule may assume
# one repository layout. Globs run with `dot: true`. Items under one
# `changed-files` key are alternatives (any of them labels the PR).
#
# Tests: tests/pr-labeler-config.py

# Application code: a changed file under a conventional top-level source
# directory, except docs, scripts, tests and hidden directories at any depth,
# Markdown and shell scripts (those belong to area/docs or area/scripts).
# Other top-level directories (infra/, config/, public/, home/, ...) and
# root-level files get no area/apps.
area/apps:
  - changed-files:
      - all-globs-to-any-file:
          - '{src,app,apps,services,packages,crates,lib,cmd,pkg,internal,backend,frontend}/**'
          - '!**/.*/**'
          - '!**/{doc,docs}/**'
          - '!**/{script,scripts}/**'
          - '!**/{test,tests,e2e,__tests__}/**'
          - '!**/*.{md,mdx}'
          - '!**/*.{sh,bash,ps1,psm1}'

area/docs:
  - changed-files:
      - any-glob-to-any-file:
          - '**/{doc,docs}/**'
      - all-globs-to-any-file:
          - '**/*.{md,mdx}'
          - '!**/CHANGELOG.md'

area/github:
  - changed-files:
      - any-glob-to-any-file:
          - .github/**

area/renovate:
  - changed-files:
      - any-glob-to-any-file:
          - renovate.json
          - renovate.json5
          - .github/renovate.json
          - .github/renovate.json5
          - .renovaterc
          - .renovaterc.json
          - .renovaterc.json5

area/scripts:
  - changed-files:
      - any-glob-to-any-file:
          - '**/{script,scripts}/**'
          - '**/*.{sh,bash,ps1,psm1}'
