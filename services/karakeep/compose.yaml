---
x-karakeep-environment: &karakeep-environment
  API_URL: http://karakeep:3000
  BROWSER_WEB_URL: http://karakeep-chrome:9222
  CRAWLER_HEADLESS_BROWSER: "true"
  DATA_DIR: /data
  DB_WAL_MODE: "true"
  DISABLE_NEW_RELEASE_CHECK: "true"
  LOG_LEVEL: info
  MEILI_ADDR: http://karakeep-meilisearch:7700
  MEILI_MASTER_KEY: ${KARAKEEP_MEILI_MASTER_KEY}
  NEXTAUTH_SECRET: ${KARAKEEP_NEXTAUTH_SECRET}
  NEXTAUTH_URL: https://karakeep.${DOMAINNAME}
  OPENAI_API_KEY: ${KARAKEEP_OPENAI_API_KEY:-}
  USING_LEGACY_SEPARATE_CONTAINERS: "true"

services:
  # The published all-in-one image supervises both Node.js processes as root
  # under s6-overlay. This stack starts the web and worker processes directly
  # so they can use the dedicated non-root TrueNAS service account instead.
  karakeep-init:
    image: docker.io/library/busybox:1.38.0@sha256:fd8d9aa63ba2f0982b5304e1ee8d3b90a210bc1ffb5314d980eb6962f1a9715d
    container_name: karakeep-init
    env_file:
      - path: .env # Decrypted from secret.sops.env
        required: false
    restart: "no"
    network_mode: none
    mem_limit: 64m
    pids_limit: 50
    security_opt:
      - no-new-privileges=true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN # Required to assign runtime paths to svc-app-karakeep
      - FOWNER # Required to tighten permissions after ownership changes
      - DAC_OVERRIDE # Required to traverse mode 700 paths on repeat deployments
    read_only: true
    command:
      - "sh"
      - "-ec"
      - |-
        for value in \
          "$${DOMAINNAME:-}" \
          "$${KARAKEEP_NEXTAUTH_SECRET:-}" \
          "$${KARAKEEP_MEILI_MASTER_KEY:-}" \
          "$${KARAKEEP_MOBILE_PROXY_TOKEN:-}" \
          "$${DB_ENC_PASSPHRASE:-}"; do
          if [ -z "$${value}" ] ||
            [ "$${value}" = "CHANGE_ME" ] ||
            [ "$${value}" = "GENERATE" ]; then
            echo "ERROR: Karakeep secrets contain an empty or unresolved sentinel value" >&2
            exit 1
          fi
        done
        mkdir -p /backups/db-backup
        chown -R 3130:3130 /backups/db-backup /data /meilisearch
        chmod -R u=rwX,g=,o= /backups/db-backup /data /meilisearch
    volumes:
      - ./backups:/backups
      - ./data/karakeep:/data
      - ./data/meilisearch:/meilisearch

  karakeep:
    image: ghcr.io/karakeep-app/karakeep:0.33.2@sha256:b069e4307dec06ea06d16989c6861c30a1ff208568be44ed5fb5d422cd3e950c
    container_name: karakeep
    depends_on:
      karakeep-chrome:
        condition: service_healthy
      karakeep-init:
        condition: service_completed_successfully
      karakeep-meilisearch:
        condition: service_healthy
    entrypoint:
      - "/bin/sh"
      - "-ec"
    command:
      - |-
        cd /db_migrations
        node /db_migrations/index.js
        cd /app/apps/web
        exec node server.js
    env_file:
      - path: .env # Decrypted from secret.sops.env
        required: false
      - path: ../shared/env/tz.env
    environment:
      <<: *karakeep-environment
    user: "3130:3130" # svc-app-karakeep
    deploy:
      update_config:
        order: stop-first # SQLite migrations must complete before the replacement serves traffic
        failure_action: rollback
      restart_policy:
        condition: on-failure
        max_attempts: 3
        window: 120s
    networks:
      - karakeep-frontend
      - karakeep-backend
      - karakeep-browser
    mem_limit: ${MEM_LIMIT:-1024m}
    pids_limit: 100
    security_opt:
      - no-new-privileges=true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /app/apps/web/.next/cache
      - /tmp
    volumes:
      - ./data/karakeep:/data
    healthcheck:
      test:
        - "CMD"
        - "node"
        - "-e"
        - "fetch('http://127.0.0.1:3000/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    labels:
      # Homepage
      - homepage.group=Productivity
      - homepage.name=Karakeep
      - homepage.icon=karakeep
      - homepage.href=https://karakeep.${DOMAINNAME}
      - homepage.description=Bookmark Manager
      # Traefik
      - "traefik.enable=true"
      - "traefik.docker.network=karakeep-frontend"
      ## HTTP Routers
      - "traefik.http.routers.karakeep-rtr.rule=Host(`karakeep.${DOMAINNAME}`)"
      - "traefik.http.routers.karakeep-rtr.entrypoints=https"
      - "traefik.http.routers.karakeep-rtr.middlewares=chain-auth@file"
      ## HTTP Services
      - "traefik.http.routers.karakeep-rtr.service=karakeep-svc"
      - "traefik.http.services.karakeep-svc.loadbalancer.server.port=3000"
      ## Karakeep mobile 1.11.1 uses only these routes at upstream commit
      ## a1a887d5. The tRPC regexes accept batches of allowlisted procedures.
      ## Karakeep API-key auth still protects user data; public discovery and
      ## login procedures require the proxy token. All other routes keep SSO.
      - >-
        traefik.http.routers.karakeep-mobile-rtr.rule=Host(`karakeep.${DOMAINNAME}`) &&
        Header(`X-Karakeep-Proxy-Token`, `${KARAKEEP_MOBILE_PROXY_TOKEN}`) &&
        (((Method(`GET`) &&
        (Path(`/api/health`) ||
        Path(`/api/version`) ||
        PathRegexp(`^/api/assets/[^/]+$`) ||
        PathRegexp(`^/api/trpc/(config\.clientConfig|bookmarks\.(getBookmarks|getBookmark|searchBookmarks|getReadingProgress)|lists\.(list|stats|get|getListsOfBookmark)|tags\.(list|get)|highlights\.(getAll|getForBookmark)|users\.(whoami|settings|stats))(,(config\.clientConfig|bookmarks\.(getBookmarks|getBookmark|searchBookmarks|getReadingProgress)|lists\.(list|stats|get|getListsOfBookmark)|tags\.(list|get)|highlights\.(getAll|getForBookmark)|users\.(whoami|settings|stats)))*$`)))
        ||
        (Method(`POST`) &&
        (Path(`/api/assets`) ||
        PathRegexp(`^/api/trpc/(apiKeys\.(exchange|validate|revoke)|bookmarks\.(createBookmark|updateBookmark|deleteBookmark|updateTags|summarizeBookmark|updateReadingProgress)|lists\.(create|edit|delete|addToList|removeFromList|leaveList)|tags\.(create|update|delete)|highlights\.(create|update|delete)|users\.(updateSettings|deleteAccount))(,(apiKeys\.(exchange|validate|revoke)|bookmarks\.(createBookmark|updateBookmark|deleteBookmark|updateTags|summarizeBookmark|updateReadingProgress)|lists\.(create|edit|delete|addToList|removeFromList|leaveList)|tags\.(create|update|delete)|highlights\.(create|update|delete)|users\.(updateSettings|deleteAccount)))*$`)))))
      - "traefik.http.routers.karakeep-mobile-rtr.entrypoints=https"
      - "traefik.http.routers.karakeep-mobile-rtr.priority=110"
      - "traefik.http.routers.karakeep-mobile-rtr.middlewares=chain-no-auth@file,karakeep-mobile-strip"
      - "traefik.http.routers.karakeep-mobile-rtr.service=karakeep-svc"
      ## Remove the proxy token before forwarding to Karakeep.
      - "traefik.http.middlewares.karakeep-mobile-strip.headers.customrequestheaders.X-Karakeep-Proxy-Token="
      ## Monitoring (Gatus — no auth, internal entrypoint only)
      - "traefik.http.routers.karakeep-monitor.rule=Host(`karakeep.${DOMAINNAME}`)"
      - "traefik.http.routers.karakeep-monitor.entrypoints=monitoring"
      - "traefik.http.routers.karakeep-monitor.middlewares=chain-no-auth@file"
      - "traefik.http.routers.karakeep-monitor.service=karakeep-svc"
      ## Gatus
      - "gatus.url=http://172.30.100.6:8444/api/health"
      - "gatus.headers.Host=karakeep.${DOMAINNAME}"
      - 'gatus.conditions=["[STATUS] == 200", "[RESPONSE_TIME] < 2000"]'
      - 'gatus.alerts=[{"type": "email"}, {"type": "custom"}]'

  karakeep-workers:
    image: ghcr.io/karakeep-app/karakeep:0.33.2@sha256:b069e4307dec06ea06d16989c6861c30a1ff208568be44ed5fb5d422cd3e950c
    container_name: karakeep-workers
    depends_on:
      karakeep:
        condition: service_healthy
    entrypoint:
      - "node"
    command:
      - "dist/index.js"
    working_dir: /app/apps/workers
    env_file:
      - path: .env # Decrypted from secret.sops.env
        required: false
      - path: ../shared/env/tz.env
    environment:
      <<: *karakeep-environment
    user: "3130:3130" # svc-app-karakeep
    deploy:
      restart_policy:
        condition: on-failure
        max_attempts: 3
        window: 120s
    stop_grace_period: 60s
    networks:
      - karakeep-frontend # Outbound access for crawling and optional AI inference
      - karakeep-backend
      - karakeep-browser
    mem_limit: ${WORKERS_MEM_LIMIT:-2048m}
    pids_limit: 100
    security_opt:
      - no-new-privileges=true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - ./data/karakeep:/data
    healthcheck:
      test:
        - "CMD"
        - "node"
        - "-e"
        - "process.exit(require('fs').readFileSync('/proc/1/cmdline').includes('dist/index.js')?0:1)"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # tiredofit/db-backup uses s6-overlay which must start as root, so read_only
  # is omitted. It retains only the capabilities needed to prepare paths and
  # drop to the app-owned 3130:3130 backup identity. The SQLite Online Backup
  # API creates a consistent snapshot while Karakeep remains in WAL mode.
  karakeep-db-backup:
    image: docker.io/tiredofit/db-backup:4.1.100@sha256:78e3cb669ee9648c1a4ab7e8421c6e89d01b659bfa5963f7611a2347b2009eab
    container_name: karakeep-db-backup
    depends_on:
      karakeep:
        condition: service_healthy
    env_file:
      - path: .env # Decrypted from secret.sops.env
        required: false
      - path: ../shared/env/tz.env
    command:
      - "backup-now"
    environment:
      - USER_DBBACKUP=3130
      - GROUP_DBBACKUP=3130
      - CONTAINER_NAME=karakeep-db-backup
      - CONTAINER_ENABLE_MONITORING=FALSE
      - CONTAINER_ENABLE_SCHEDULING=FALSE
      - MODE=MANUAL
      - MANUAL_RUN_FOREVER=FALSE
      - ENABLE_NOTIFICATIONS=FALSE
      - DEFAULT_CHECKSUM=SHA1
      - DEFAULT_COMPRESSION=ZSTD
      - DEFAULT_CLEANUP_TIME=2880
      - DEFAULT_ENCRYPT=TRUE
      - DEFAULT_ENCRYPT_PASSPHRASE=${DB_ENC_PASSPHRASE}
      - DEFAULT_FILESYSTEM_PATH=/backup-data/db-backup
      - DB01_TYPE=sqlite3
      - DB01_HOST=/karakeep-data/db.db
    restart: "no"
    network_mode: none
    mem_limit: ${BACKUP_MEM_LIMIT:-1024m}
    pids_limit: 100
    security_opt:
      - no-new-privileges=true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN # s6 prepares runtime paths before starting the backup process
      - DAC_OVERRIDE # s6 creates root-owned runtime paths before dropping privileges
      - FOWNER # s6 tightens modes after changing path ownership
      - SETGID # s6 initializes the configured backup group
      - SETUID # s6 initializes the configured backup user
      - SETPCAP # s6 clears its capability bounding set before exec
    volumes:
      - ./data/karakeep:/karakeep-data:ro
      - ./backups:/backup-data

  # Chrome processes attacker-controlled pages without its browser sandbox.
  # Keep its DevTools listener on a dedicated internal network and give only
  # Chrome a separate egress bridge for public-page fetches.
  karakeep-chrome:
    image: ghcr.io/karakeep-app/karakeep-chrome:151.0.7922.47-r1@sha256:5b19bbb160e9ff60681a3abd97e1c4ec9f64212301410de658c3900ab7ef31e7
    container_name: karakeep-chrome
    init: true
    # Keep these upstream run.sh defaults in sync when updating the image.
    entrypoint:
      - /bin/bash
      - /usr/local/bin/chrome-supervisor.sh
      - /headless-shell/headless-shell
      - --no-sandbox
      - --use-gl=angle
      - --use-angle=swiftshader
      - --remote-debugging-address=0.0.0.0
      - --remote-debugging-port=9223
    command:
      - --disable-gpu
      - --disable-dev-shm-usage
      - --hide-scrollbars
      - --disable-blink-features=AutomationControlled
      - --window-size=1440,900
    env_file:
      - path: ../shared/env/tz.env
    user: "65534:65534" # Upstream image's non-root nobody identity
    deploy:
      restart_policy:
        condition: on-failure
        max_attempts: 3
        window: 120s
    networks:
      - karakeep-browser-egress
      - karakeep-browser
    mem_limit: ${CHROME_MEM_LIMIT:-2048m}
    pids_limit: 100
    security_opt:
      - no-new-privileges=true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/fontconfig
    volumes:
      - ./config/chrome-supervisor.sh:/usr/local/bin/chrome-supervisor.sh:ro
    labels:
      - config.sha256=${CONFIG_HASH:-}
    healthcheck:
      test:
        - "CMD"
        - "bash"
        - "-ec"
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9222;
          printf 'GET /json/version HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3;
          IFS= read -r status <&3;
          content_length=;
          while IFS= read -r line <&3; do
            line="$${line%$$'\r'}";
            case "$${line}" in
              Content-Length:*) content_length="$${line#Content-Length:}" ;;
              "") break ;;
            esac;
          done;
          case "$${content_length}" in
            ""|*[!0-9]*) exit 1 ;;
          esac;
          body=;
          IFS= read -r -N "$${content_length}" body <&3;
          [[ "$${status}" == *" 200 "* && "$${body}" == *'"webSocketDebuggerUrl"'* ]]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  karakeep-meilisearch:
    image: docker.io/getmeili/meilisearch:v1.41.0@sha256:860fa4baed04ae1c235de870edab0c8006227546dea1bbb6411fbfc5e27cf1db
    container_name: karakeep-meilisearch
    depends_on:
      karakeep-init:
        condition: service_completed_successfully
    env_file:
      - path: .env # Decrypted from secret.sops.env
        required: false
      - path: ../shared/env/tz.env
    environment:
      MEILI_ENV: production
      MEILI_MASTER_KEY: ${KARAKEEP_MEILI_MASTER_KEY}
      MEILI_NO_ANALYTICS: "true"
    user: "3130:3130" # svc-app-karakeep
    deploy:
      restart_policy:
        condition: on-failure
        max_attempts: 3
        window: 120s
    networks:
      - karakeep-backend
    mem_limit: ${MEILI_MEM_LIMIT:-1024m}
    pids_limit: 100
    security_opt:
      - no-new-privileges=true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - ./data/meilisearch:/meili_data
    healthcheck:
      test:
        - "CMD"
        - "curl"
        - "--fail"
        - "--silent"
        - "http://127.0.0.1:7700/health"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

networks:
  karakeep-frontend:
    name: karakeep-frontend
    driver: bridge
  karakeep-backend:
    name: karakeep-backend
    internal: true
  karakeep-browser:
    name: karakeep-browser
    driver: bridge
    enable_ipv6: false # Upstream socat exposes the DevTools endpoint over TCP4 only
    internal: true
  karakeep-browser-egress:
    name: karakeep-browser-egress
    driver: bridge
