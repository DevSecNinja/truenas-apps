http_port 3128
visible_hostname browser-proxy

acl web_ports port 80 443
acl tls_ports port 443
acl CONNECT method CONNECT
acl eligible_destination dst 1.0.0.0-223.255.255.255 2000::/3
acl forbidden_destination dst 0.0.0.0/8 10.0.0.0/8 100.64.0.0/10 127.0.0.0/8
acl forbidden_destination dst 169.254.0.0/16 172.16.0.0/12 192.0.0.0/24 192.0.2.0/24
acl forbidden_destination dst 192.88.99.0/24 192.168.0.0/16 198.18.0.0/15 198.51.100.0/24
acl forbidden_destination dst 203.0.113.0/24 224.0.0.0/4 240.0.0.0/4
# Exclude special-use and transition assignments within IPv6 global unicast.
# IPv4-mapped addresses are normalized by Squid and checked by the IPv4 ACLs.
acl forbidden_destination dst 2001::/23 2001:db8::/32 2002::/16 3fff::/20

http_access deny manager
http_access deny !web_ports
http_access deny CONNECT !tls_ports
http_access deny !eligible_destination
http_access deny forbidden_destination
http_access allow all

host_verify_strict on
cache deny all
cache_mem 8 MB
access_log none
cache_store_log none
cache_log /dev/stderr
pid_filename /tmp/squid.pid
coredump_dir /tmp
cache_effective_user nobody
cache_effective_group nogroup
pinger_enable off
shutdown_lifetime 1 seconds
