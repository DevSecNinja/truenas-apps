 # see https://docs.cocogitto.io/
#
# In this repo, cocogitto is used **only for commit-message validation**
# (via `cog verify` in the lefthook commit-msg hook). Version bumping
# and CHANGELOG generation are owned by release-please — see
# `.github/workflows/release-please.yml`.
tag_prefix = "v"
from_latest_tag = true
ignore_merge_commits = true
disable_changelog = true

# Register the `deps` Conventional Commit type used by Renovate dependency
# updates (see renovate.json5) so `cog verify` accepts `deps(scope): ...`
# commit messages. release-please maps this type to the "Dependencies"
# section of the release notes.
[commit_types]
deps = { changelog_title = "Dependencies" }
