---
rules:
  ref-version-mismatch:
    # Renovate tracks these SHA-pinned main refs; keep uses comments parseable.
    # Scope exceptions to existing locations, not whole workflows or future pins.
    ignore:
      - image-security.yml:36
      - image-security.yml:70
      - image-security.yml:110
      - image-security.yml:113
      - lint.yml:21
      - lint.yml:66
      - lint.yml:87
      - lint.yml:113
      - test.yml:26
