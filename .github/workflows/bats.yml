---
name: "Reusable — BATS Tests"

on:
  workflow_call:
    inputs:
      mise-version:
        description: "mise version to install (required, no default per ADR 0001)"
        required: true
        type: string
      test-dirs:
        description: "Space-separated list of directories to pass to bats (default: tests/)"
        required: false
        type: string
        default: "tests/"
      bats-args:
        description: "Additional arguments to pass to bats (e.g. --filter-tags unit)"
        required: false
        type: string
        default: ""
      check-name:
        description: "Name for the GitHub check annotation"
        required: false
        type: string
        default: "BATS Test Results"

permissions:
  contents: read

jobs:
  test:
    name: BATS
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      checks: write
    steps:
      - name: Harden runner
        # renovate: datasource=github-tags depName=DevSecNinja/.github
        uses: DevSecNinja/.github/actions/harden-runner@bf22fcfcb4ef94a359eed55cea4b5ce7f5b98167 # main

      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Install mise
        uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          install: true
          version: ${{ inputs.mise-version }}

      - name: Install BATS helper libraries
        run: bash tests/setup_libs.sh

      - name: Run BATS tests
        env:
          BATS_ARGS: ${{ inputs.bats-args }}
          TEST_DIRS: ${{ inputs.test-dirs }}
        run: |
          # shellcheck disable=SC2086
          mise exec -- bats \
            --formatter tap \
            --report-formatter junit \
            --output . \
            ${BATS_ARGS} \
            ${TEST_DIRS}

      - name: Publish test results
        uses: mikepenz/action-junit-report@d9f48fc87bc235f7e214acf696ca5abc0a986f16 # v6.4.2
        if: always()
        with:
          report_paths: report.xml
          check_name: ${{ inputs.check-name }}

      - name: Upload test results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: bats-test-results
          path: report.xml
          retention-days: 30
