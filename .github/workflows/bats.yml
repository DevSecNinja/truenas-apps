---
name: "Reusable — BATS Tests"

on:
  workflow_call:
    inputs:
      mise-version:
        description: "mise version to install (required, no default per ADR 0001)"
        required: true
        type: string
      test-dirs:
        description: "Space-separated list of directories to pass to bats (default: tests/)"
        required: false
        type: string
        default: "tests/"
      bats-args:
        description: "Additional arguments to pass to bats (e.g. --filter-tags unit)"
        required: false
        type: string
        default: ""
      check-name:
        description: "Name for the GitHub check annotation"
        required: false
        type: string
        default: "BATS Test Results"

permissions:
  contents: read

jobs:
  test:
    name: BATS
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      checks: write
    steps:
      - name: Harden runner
        # renovate: datasource=github-tags depName=DevSecNinja/.github
        uses: DevSecNinja/.github/actions/harden-runner@76bb084c3dd335be7cc5cfffead44376120eb68c # main

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install mise
        uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          install: true
          version: ${{ inputs.mise-version }}

      - name: Install BATS helper libraries
        run: bash tests/setup_libs.sh

      - name: Run BATS tests
        env:
          BATS_ARGS: ${{ inputs.bats-args }}
          CI: "true"
          TEST_DIRS: ${{ inputs.test-dirs }}
        run: |
          # shellcheck disable=SC2086
          mise exec -- bats \
            --formatter tap \
            --report-formatter junit \
            --output . \
            ${BATS_ARGS} \
            ${TEST_DIRS}

      - name: Publish test results
        uses: mikepenz/action-junit-report@6ef3fdcfcd5f0b5d14df3e659ef19b8c6820f93d # v6.6.1
        if: always()
        with:
          report_paths: report.xml
          check_name: ${{ inputs.check-name }}

      - name: Upload test results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: bats-test-results
          path: report.xml
          retention-days: 30
