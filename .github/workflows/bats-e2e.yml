---
name: "Reusable — BATS E2E Tests"

on:
  workflow_call:
    inputs:
      mise-version:
        description: "mise version to install (required, no default per ADR 0001)"
        required: true
        type: string
      test-dirs:
        description: "Space-separated list of E2E test directories"
        required: false
        type: string
        default: "tests/"
      bats-args:
        description: "Additional arguments to pass to bats"
        required: false
        type: string
        default: ""
      timeout-minutes:
        description: "Job timeout in minutes (E2E tests may be slower)"
        required: false
        type: number
        default: 20
      check-name:
        description: "Name for the GitHub check annotation"
        required: false
        type: string
        default: "BATS E2E Test Results"

permissions:
  contents: read

jobs:
  e2e:
    name: BATS E2E
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
      checks: write
    steps:
      - name: Harden runner
        # renovate: datasource=github-tags depName=DevSecNinja/.github
        uses: DevSecNinja/.github/actions/harden-runner@76bb084c3dd335be7cc5cfffead44376120eb68c # main

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install mise
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          install: true
          version: ${{ inputs.mise-version }}

      - name: Install BATS helper libraries
        run: bash tests/setup_libs.sh

      - name: Verify Docker is available
        run: docker version

      - name: Run BATS E2E tests
        env:
          BATS_ARGS: ${{ inputs.bats-args }}
          TEST_DIRS: ${{ inputs.test-dirs }}
        run: |
          # shellcheck disable=SC2086
          mise exec -- bats \
            --formatter tap \
            --report-formatter junit \
            --output . \
            ${BATS_ARGS} \
            ${TEST_DIRS}

      - name: Publish test results
        uses: mikepenz/action-junit-report@d9f48fc87bc235f7e214acf696ca5abc0a986f16 # v6.4.2
        if: always()
        with:
          report_paths: report.xml
          check_name: ${{ inputs.check-name }}

      - name: Docker cleanup
        if: always()
        run: |
          docker compose down --remove-orphans 2>/dev/null || true
          docker system prune -f 2>/dev/null || true

      - name: Upload test results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: bats-e2e-test-results
          path: report.xml
          retention-days: 30
