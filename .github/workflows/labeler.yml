---
name: Labeler

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

# Collapse redundant runs when a PR is updated in quick succession (e.g.
# Renovate rebases). Labeling is idempotent, so cancelling an in-flight
# run is safe and saves Actions minutes. See DevSecNinja/.github
# docs/workflow-trigger-conventions.md.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  labeler:
    uses: DevSecNinja/.github/.github/workflows/labeler.yml@e744bc05bb096d6356cc913900ff62482e656046 # main
    permissions:
      contents: read
      pull-requests: write
