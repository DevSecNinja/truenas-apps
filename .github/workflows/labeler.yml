---
name: Labeler

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  labeler:
    uses: DevSecNinja/.github/.github/workflows/labeler.yml@76bb084c3dd335be7cc5cfffead44376120eb68c # main
    with:
      # This repository's rules; the reusable workflow defaults to
      # .github/pr-labeler.yaml, which doesn't exist here.
      config-path: .github/labeler.yaml
    # The reusable workflow's issue-labeler job asks for issues: write; without
    # it every run fails to start (startup_failure), even on pull requests.
    permissions:
      contents: read
      pull-requests: write
      issues: write
