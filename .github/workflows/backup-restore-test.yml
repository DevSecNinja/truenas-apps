---
name: Backup Restore Test

on:
  pull_request:
    paths:
      - .github/workflows/backup-restore-test.yml
      - scripts/gha-backup-restore-test.sh
  schedule:
    - cron: "0 4 * * 6" # 04:00 UTC every Saturday
  workflow_dispatch: # checkov:skip=CKV_GHA_7: Not a build workflow — no artifacts are produced.

permissions:
  contents: read

jobs:
  backup-restore-test:
    name: Database backup/restore cycle (pgsql, mongo, sqlite3)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Harden runner
        # renovate: datasource=github-tags depName=DevSecNinja/.github
        uses: DevSecNinja/.github/actions/harden-runner@76bb084c3dd335be7cc5cfffead44376120eb68c # main

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install dependencies
        run: sudo apt-get install -y --no-install-recommends zstd sqlite3

      - name: Run backup/restore test
        run: bash scripts/gha-backup-restore-test.sh

      - name: Docker cleanup
        if: always()
        run: |-
          docker rm -f \
            backup-test-pg-source backup-test-pg-restore \
            backup-test-mongo-source backup-test-mongo-restore \
            2>/dev/null || true
          docker network rm backup-test-net 2>/dev/null || true
          docker system prune -f 2>/dev/null || true
