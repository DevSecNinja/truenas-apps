---
name: Label Sync

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/labels.yaml
  schedule:
    # Weekly drift-correction is enough: the authoritative label set is
    # applied on every push that changes .github/labels.yaml, so the cron
    # only needs to catch occasional manual edits made in the UI. Weekly
    # (instead of daily) trims ~26 scheduled runs per month.
    - cron: "0 0 * * 1"

permissions:
  contents: read

jobs:
  label-sync:
    uses: DevSecNinja/.github/.github/workflows/label-sync.yml@76bb084c3dd335be7cc5cfffead44376120eb68c # main
    permissions:
      contents: read
      issues: write
    with:
      labels-file: .github/labels.yaml
