---
name: Label Sync

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/labels.yaml
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: read

jobs:
  label-sync:
    uses: DevSecNinja/.github/.github/workflows/label-sync.yml@76bb084c3dd335be7cc5cfffead44376120eb68c # main
    permissions:
      contents: read
      issues: write
    with:
      labels-file: .github/labels.yaml
