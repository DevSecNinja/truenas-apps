---
name: Image Security

on:
  pull_request:
    paths:
      - .github/workflows/image-security.yml
      - scripts/gha-image-age-check.sh
      - scripts/gha-renovate-health-check.sh
      - scripts/gha-trivy-image-scan.sh
  schedule:
    - cron: "0 2 * * 6"
  workflow_dispatch:
    # checkov:skip=CKV_GHA_7: Not a build workflow — no artifacts are produced.
    # threshold_days only affects a date comparison for issue creation.
    inputs:
      threshold_days:
        description: "Flag images older than this many days (default: 90)"
        required: false
        default: "90"
        type: string

permissions:
  contents: read

jobs:
  image-age-check:
    name: Image age check
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
    steps:
      - name: Harden runner
        # renovate: datasource=github-tags depName=DevSecNinja/.github
        uses: DevSecNinja/.github/actions/harden-runner@76bb084c3dd335be7cc5cfffead44376120eb68c # main

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install crane
        uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        with:
          # Only crane, pinned in .mise.toml, not the whole toolset.
          install_args: aqua:google/go-containerregistry
          # renovate: datasource=github-releases depName=jdx/mise
          version: 2026.10.13

      - name: Check image ages and open issues for stale images
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          THRESHOLD_DAYS: ${{ inputs.threshold_days || '90' }}
        run: bash scripts/gha-image-age-check.sh

      - name: Check Renovate dependency lookups
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/gha-renovate-health-check.sh
        # The live dashboard describes main, not the pull request under test.
        # Unit tests cover this script on pull requests.
        if: ${{ github.event_name != 'pull_request' }}

  trivy-image-scan:
    name: Trivy image vulnerability scan
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    # No continue-on-error: a failed scan must turn the run red and page IRM.
    # The script then writes no SARIF, so the upload is skipped and no alert
    # closes on a partial scan.
    steps:
      - name: Harden runner
        # renovate: datasource=github-tags depName=DevSecNinja/.github
        uses: DevSecNinja/.github/actions/harden-runner@76bb084c3dd335be7cc5cfffead44376120eb68c # main

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install mise
        uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        with:
          install: true
          # renovate: datasource=github-releases depName=jdx/mise
          version: 2026.10.13

      - name: Scan images and build combined SARIF
        env:
          # Docker Hub credentials for dhi.io, as dccd.sh uses. Without them
          # the dhi.io images are listed as unscanned.
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: bash scripts/gha-trivy-image-scan.sh

      - name: Upload combined SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: sarif-output/trivy-images.sarif
          category: trivy-images

      # Not written when dhi.io images were skipped for missing credentials, so
      # that run leaves this category's alerts open instead of closing them.
      - name: Upload dhi.io SARIF to GitHub Security tab
        if: hashFiles('sarif-output/trivy-images-dhi.sarif') != ''
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: sarif-output/trivy-images-dhi.sarif
          category: trivy-images-dhi

  # --- Page on scheduled/manual run failure (Phase 3 of #15) ---
  # PR runs are excluded — they only execute on workflow-file edits and a
  # red PR check is signal enough. Schedule + workflow_dispatch failures
  # warrant a page because nobody is watching the run interactively.
  notify-irm:
    name: Notify Grafana IRM
    needs:
      - image-age-check
      - trivy-image-scan
    if: ${{ always() && github.event_name != 'pull_request' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Harden runner
        # renovate: datasource=github-tags depName=DevSecNinja/.github
        uses: DevSecNinja/.github/actions/harden-runner@76bb084c3dd335be7cc5cfffead44376120eb68c # main

      - name: Notify Grafana IRM
        uses: DevSecNinja/.github/.github/actions/notify-irm@76bb084c3dd335be7cc5cfffead44376120eb68c # main
        with:
          webhook-url: ${{ secrets.GRAFANA_IRM_WEBHOOK_URL }}
          # `needs.*.result` is system-controlled, safe to interpolate.
          job-failed: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
