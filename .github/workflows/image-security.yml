---
name: Image Security

on:
  pull_request:
    paths:
      - .github/workflows/image-security.yml
      - scripts/gha-image-age-check.sh
      - scripts/gha-trivy-image-scan.sh
  schedule:
    - cron: "0 2 * * 6"
  workflow_dispatch:
    # checkov:skip=CKV_GHA_7: Not a build workflow — no artifacts are produced.
    # threshold_days only affects a date comparison for issue creation.
    inputs:
      threshold_days:
        description: "Flag images older than this many days (default: 90)"
        required: false
        default: "90"
        type: string

permissions:
  contents: read

jobs:
  image-age-check:
    name: Image age check
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
    steps:
      - name: Harden runner
        # renovate: datasource=github-tags depName=DevSecNinja/.github
        uses: DevSecNinja/.github/actions/harden-runner@76bb084c3dd335be7cc5cfffead44376120eb68c # main

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install crane
        uses: imjasonh/setup-crane@feee3b6bb0d4c68370f256a4502498c9227e5c6b # v0.7

      - name: Check image ages and open issues for stale images
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          THRESHOLD_DAYS: ${{ inputs.threshold_days || '90' }}
        run: bash scripts/gha-image-age-check.sh

  trivy-image-scan:
    name: Trivy image vulnerability scan
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    continue-on-error: true
    steps:
      - name: Harden runner
        # renovate: datasource=github-tags depName=DevSecNinja/.github
        uses: DevSecNinja/.github/actions/harden-runner@76bb084c3dd335be7cc5cfffead44376120eb68c # main

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install mise
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          install: true
          # renovate: datasource=github-releases depName=jdx/mise
          version: 2026.8.10

      - name: Scan images and build combined SARIF
        run: bash scripts/gha-trivy-image-scan.sh

      - name: Upload combined SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        if: always()
        with:
          sarif_file: sarif-output/trivy-images.sarif
          category: trivy-images

  # --- Page on scheduled/manual run failure (Phase 3 of #15) ---
  # PR runs are excluded — they only execute on workflow-file edits and a
  # red PR check is signal enough. Schedule + workflow_dispatch failures
  # warrant a page because nobody is watching the run interactively.
  notify-irm:
    name: Notify Grafana IRM
    needs:
      - image-age-check
      - trivy-image-scan
    if: ${{ always() && github.event_name != 'pull_request' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Harden runner
        # renovate: datasource=github-tags depName=DevSecNinja/.github
        uses: DevSecNinja/.github/actions/harden-runner@76bb084c3dd335be7cc5cfffead44376120eb68c # main

      - name: Notify Grafana IRM
        uses: DevSecNinja/.github/.github/actions/notify-irm@76bb084c3dd335be7cc5cfffead44376120eb68c # main
        with:
          webhook-url: ${{ secrets.GRAFANA_IRM_WEBHOOK_URL }}
          # `needs.*.result` is system-controlled, safe to interpolate.
          job-failed: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
