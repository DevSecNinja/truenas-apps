---
name: Secret scan

# Full-history gitleaks scan (DevSecNinja/.github v4.1.0+), after each merge,
# weekly and on dispatch. The Lint workflow scans only a pull request's own
# commits; this re-checks every commit with the current gitleaks rules (the
# version is Renovate-managed). It only reports. This repository is public, so
# the findings go to code scanning (category `gitleaks/history`, visible only
# with write access) and the job log shows a count only. See DevSecNinja/.github
# docs/architecture.md.
on:
  push:
    branches:
      - main
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch: # checkov:skip=CKV_GHA_7: Scan workflow only -- no artifacts produced.

permissions:
  contents: read

# A newer push supersedes a queued scan; a running one finishes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gitleaks:
    uses: DevSecNinja/.github/.github/workflows/lint-include.yml@c93b7670605e165cc757724b690deb130784e803 # v4.4.0
    permissions:
      contents: read
      security-events: write
    with:
      # renovate: datasource=github-releases depName=jdx/mise
      mise-version: "2026.11.8"
      # History findings only report; this fails the run when the scan or the
      # code scanning upload fails, so a silent gap can't look green.
      lint-fail-on-error: true
      # lint-include.yml runs no linter unless it is set to true.
      lint-gitleaks: true
